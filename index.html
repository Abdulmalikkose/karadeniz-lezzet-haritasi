
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karadeniz Lezzet Haritası</title>

  <meta name="theme-color" content="#2E7D32">
  <link rel="manifest" href="manifest.json">

<body>

  <header class="hero">
    <h1>Karadeniz Lezzet Haritası</h1>

  <main class="cards">

    <div class="card">
      <span>🍳</span>
      <h2>Kahvaltı</h2>
      <p>En iyi kahvaltı noktaları.</p>
    </div>

    <div class="card">
      <span>🫕</span>
      <h2>Kuymak</h2>
      <p>Gerçek kuymak nerede yenir?</p>
    </div>

    <div class="card">
      <span>🌄</span>
      <h2>Yaylalar</h2>
      <p>Elevit, Pokut ve daha fazlası.</p>
    </div>

    <div class="card">
      <span>📸</span>
      <h2>Fotoğraf Noktaları</h2>
      <p>En güzel manzara rotaları.</p>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="#">🏠</a>
    <a href="#">📍</a>
    <a href="#">🍽️</a>

  <script src="script.js"></script>

</html>
